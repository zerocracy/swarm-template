---
# Number of cycles to run the judge. First cycle: hi exists, hello absent
# -> judge creates hello. Second cycle: both exist -> query matches nothing
# -> no new facts. Final: 1 fact with hello set.
runs: 2
input:
  -
    _id: 1
    what: something-else
    when: 2024-05-12T23:54:24Z
    hi: 'How are you?'
expected:
  - /fb[count(f)=1]
  - >-
    /fb/f[_id=1 and (hello="Hello, Jeff!" or hello="Hello, Nicole!" or
    hello="Hello, Peter!" or hello="Hello, Sarah!" or hello="Hello, John!" or
    hello="Hello, Natasha!")]
